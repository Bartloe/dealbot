# =============================================================================
#  Dealbot — dagelijks de aanbiedingen ophalen
#
#  Versie : 1.4
#  Reden  : Picnic is erbij. Zijn hele winkel wordt lade voor lade afgelopen,
#           wat een minuut of vijf kost, en dat kan alleen met een ingelogde
#           sleutel — vandaar de extra instelling en de ruimere tijd.
#  Datum  : 05-08-2026 14:10
#
#  Draait elke ochtend om 07:00 Nederlandse tijd (05:00 UTC) en is daarnaast
#  handmatig te starten via het tabblad Actions op GitHub.
# =============================================================================

name: Aanbiedingen ophalen

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  ophalen:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Code ophalen
        uses: actions/checkout@v7

      - name: Python klaarzetten
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Benodigdheden installeren
        run: pip install -r requirements.txt

      - name: Aanbiedingen en standaardprijzen ophalen
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Alle Gemini-sleutels achter elkaar, gescheiden door komma's. Zonder
          # deze instelling gaat alles gewoon door; alleen de folder van Vomar
          # blijft dan ongelezen.
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          # De geverifieerde sleutel van het Picnic-account. Picnic vraagt bij
          # elke verse inlog om een code per sms of e-mail, en die kan een
          # ochtendronde niet beantwoorden; daarom is er één keer met de hand
          # ingelogd en gebruiken we die sleutel. Zonder deze instelling gaat de
          # ronde gewoon door, maar blijft Picnic buiten de lijst.
          PICNIC_TOKEN: ${{ secrets.PICNIC_TOKEN }}
        run: python scripts/scan.py
