# =============================================================================
#  Dealbot — dagelijks de aanbiedingen ophalen
#
#  Versie : 1.5
#  Reden  : Het ophalen is voortaan ook met één knop op de beheerpagina te
#           starten. Die knop moet kunnen kiezen wát er opgehaald wordt — de
#           hele ronde, alleen de winkels, of alleen de folder van Vomar — en
#           moet een al gelezen folder opnieuw kunnen laten voorlezen.
#  Datum  : 05-08-2026 23:52
#
#  Draait elke ochtend om 07:00 Nederlandse tijd (05:00 UTC). Daarnaast met de
#  hand te starten: vanaf de beheerpagina van Dealbot, of hier op GitHub via
#  het tabblad Actions.
# =============================================================================

name: Aanbiedingen ophalen

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      wat:
        description: "Wat moet er opgehaald worden?"
        type: choice
        default: alles
        options:
          - alles
          - winkels
          - folder
      opnieuw:
        description: "De folder ook lezen als hij al gelezen is (kost AI-vragen)"
        type: boolean
        default: false

jobs:
  ophalen:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Code ophalen
        uses: actions/checkout@v7

      - name: Python klaarzetten
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Benodigdheden installeren
        run: pip install -r requirements.txt

      - name: Aanbiedingen en standaardprijzen ophalen
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Alle Gemini-sleutels achter elkaar, gescheiden door komma's. Zonder
          # deze instelling gaat alles gewoon door; alleen de folder van Vomar
          # blijft dan ongelezen.
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          # De geverifieerde sleutel van het Picnic-account. Picnic vraagt bij
          # elke verse inlog om een code per sms of e-mail, en die kan een
          # ochtendronde niet beantwoorden; daarom is er één keer met de hand
          # ingelogd en gebruiken we die sleutel. Zonder deze instelling gaat de
          # ronde gewoon door, maar blijft Picnic buiten de lijst.
          PICNIC_TOKEN: ${{ secrets.PICNIC_TOKEN }}
        # Bij de ochtendronde zijn de keuzes leeg; dan wordt het gewoon alles.
        run: >
          python scripts/scan.py
          --wat "${{ inputs.wat || 'alles' }}"
          ${{ (inputs.opnieuw == true || inputs.opnieuw == 'true') && '--opnieuw' || '' }}
