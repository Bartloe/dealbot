# =============================================================================
#  Dealbot — dagelijks de aanbiedingen ophalen
#
#  Versie : 1.1
#  Reden  : GitHub stopt met de oude motor waarop de hulpstukken draaiden en
#           waarschuwde daarover. De hulpstukken zijn bijgewerkt naar de versie
#           die op de nieuwe motor loopt, zodat de ochtendrun blijft werken.
#  Datum  : 31-07-2026 10:52
#
#  Draait elke ochtend om 07:00 Nederlandse tijd (05:00 UTC) en is daarnaast
#  handmatig te starten via het tabblad Actions op GitHub.
# =============================================================================

name: Aanbiedingen ophalen

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  ophalen:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Code ophalen
        uses: actions/checkout@v7

      - name: Python klaarzetten
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Benodigdheden installeren
        run: pip install -r requirements.txt

      - name: Aanbiedingen ophalen
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/scan.py
