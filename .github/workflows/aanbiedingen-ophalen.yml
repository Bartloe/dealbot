# =============================================================================
#  Dealbot — dagelijks de aanbiedingen ophalen
#
#  Versie : 1.2
#  Reden  : Dezelfde ronde haalt nu ook de gewone winkelprijzen op voor de
#           standaardprijzen-pagina. Dat kost er twee verzoeken extra bij, dus
#           er hoeft niets aan de tijden te veranderen.
#  Datum  : 02-08-2026 14:00
#
#  Draait elke ochtend om 07:00 Nederlandse tijd (05:00 UTC) en is daarnaast
#  handmatig te starten via het tabblad Actions op GitHub.
# =============================================================================

name: Aanbiedingen ophalen

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  ophalen:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Code ophalen
        uses: actions/checkout@v7

      - name: Python klaarzetten
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Benodigdheden installeren
        run: pip install -r requirements.txt

      - name: Aanbiedingen en standaardprijzen ophalen
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/scan.py
