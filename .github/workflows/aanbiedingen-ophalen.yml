# =============================================================================
#  Dealbot — dagelijks de aanbiedingen ophalen
#
#  Versie : 1.3
#  Reden  : De weekfolder van Vomar wordt nu met AI uitgelezen. Dat gebeurt
#           alleen als er een nieuwe folder hangt (in de praktijk één keer per
#           week) maar duurt dan een minuut of tien; vandaar de ruimere tijd.
#           De Gemini-sleutels komen als één instelling mee.
#  Datum  : 03-08-2026 10:50
#
#  Draait elke ochtend om 07:00 Nederlandse tijd (05:00 UTC) en is daarnaast
#  handmatig te starten via het tabblad Actions op GitHub.
# =============================================================================

name: Aanbiedingen ophalen

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  ophalen:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Code ophalen
        uses: actions/checkout@v7

      - name: Python klaarzetten
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Benodigdheden installeren
        run: pip install -r requirements.txt

      - name: Aanbiedingen en standaardprijzen ophalen
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Alle Gemini-sleutels achter elkaar, gescheiden door komma's. Zonder
          # deze instelling gaat alles gewoon door; alleen de folder van Vomar
          # blijft dan ongelezen.
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        run: python scripts/scan.py
