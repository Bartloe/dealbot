<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dealbot — standaardprijzen</title>
    <link rel="stylesheet" href="assets/stijl.css">
</head>
<body>
    <header class="balk" data-na-inloggen hidden>
        <a class="merk" href="index.html">Dealbot</a>
        <nav>
            <a href="index.html">Aanbiedingen</a>
            <a class="huidig" href="standaardprijzen.html">Standaardprijzen</a>
            <a href="profiel.html">Mijn profiel</a>
            <button type="button" id="uitloggen">Uitloggen</button>
        </nav>
    </header>

    <div id="inlogscherm" hidden></div>

    <main data-na-inloggen hidden>
        <h1>Standaardprijzen</h1>
        <p class="uitleg">
            Wat kost iets als er even geen aanbieding is? Hier staan de gewone
            winkelprijzen. Zoek op een merk of productnaam, of kies een productgroep.
        </p>
        <p class="melding" id="melding" role="alert" hidden></p>

        <section class="zoekbalk">
            <label>
                Zoeken op merk of productnaam
                <input type="search" id="zoekterm" placeholder="bijvoorbeeld koffiebonen"
                       autocomplete="off">
                <small>Zoekt in het merk en de productnaam.</small>
            </label>

            <label>
                Of kies een productgroep
                <select id="groep">
                    <option value="">— kies een groep —</option>
                </select>
                <small>De indeling van de winkel zelf, met het aantal producten erin.</small>
            </label>
        </section>

        <p class="samenvatting" id="samenvatting" hidden></p>
        <div id="lijst"></div>
    </main>

    <script type="module" src="assets/prijzen.js"></script>
</body>
</html>
